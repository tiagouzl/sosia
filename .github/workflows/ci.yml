name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- --deny warnings
      - run: cargo test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: >
          tar -czf sosia-${{ github.ref_name }}-linux-x86_64.tar.gz
          -C target/release sosia README.md LICENSE
      - run: gh release upload ${{ github.ref_name }} sosia-${{ github.ref_name }}-linux-x86_64.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
